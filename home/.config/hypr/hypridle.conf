# hypridle only handles sleep now. The idle timeouts (dim, lock, screens off,
# suspend, on AC and on battery) are the shell's: services/IdleTimers.qml,
# set in ~/.config/simplychit/settings.json ("idle") or the settings app's
# Idle & power page.
#
# What stays here follows logind: lock before the machine sleeps, and turn the
# screens back on after, so a key press is not needed twice. lock_cmd is what
# `loginctl lock-session` (the power menu's Lock, and the shell's lock step)
# ends up running: the shell's lock screen if enabled, otherwise hyprlock.

#
# ignore_dbus_inhibit: hypridle would otherwise take org.freedesktop.ScreenSaver,
# where browsers ask to stay awake, and with no listeners here do nothing with
# it. `simplychit inhibitors` owns that name instead and tells the shell.

general {
    ignore_dbus_inhibit = true
    lock_cmd = $HOME/.config/hypr/Scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
