# The desktop wallpaper.
#
# `path` is a pointer, not a picture. ~/.local/state/archdots/wallpaper is a
# symlink that install.sh creates and the wallpaper picker (SUPER + W) re-points
# every time you choose a new one, so the choice lives outside the repo: this
# file reads the same on every machine, changing wallpaper never shows up as a
# repo change, and nobody inherits somebody else's picture.
#
# A missing pointer is not fatal. hyprpaper logs that it could not resolve the
# path and carries on, so the desktop comes up plain rather than not at all.
#
# The empty monitor is deliberate: it means *every* output, which keeps working
# when the outputs change — a dock, a new cable, a nested session. Naming
# monitors here reads tidier and silently shows nothing the moment one of them
# is called something else.
splash = false

wallpaper {
    monitor =
    path = ~/.local/state/archdots/wallpaper
}
