# Only imports. Alacritty loads the importing file *last*, so any setting kept
# here would beat the user's file. The settings live in archdots.toml instead.
#
#   archdots.toml                            defaults (tracked)
#   ~/.cache/wal/colors-alacritty.toml       pywal16 colours (generated)
#   ~/.config/archdots/local/alacritty.toml  yours (untracked, wins)
[general]
import = [
    "~/.config/alacritty/archdots.toml",
    "~/.cache/wal/colors-alacritty.toml",
    "~/.config/archdots/local/alacritty.toml",
]
