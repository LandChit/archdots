# Only imports. Alacritty loads the importing file *last*, so any setting kept
# here would beat the user's file. The settings live in simplychit.toml instead.
#
#   simplychit.toml                            defaults (tracked)
#   ~/.cache/wal/colors-alacritty.toml       pywal16 colours (generated)
#   ~/.config/simplychit/local/alacritty.toml  yours (untracked, wins)
[general]
import = [
    "~/.config/alacritty/simplychit.toml",
    "~/.cache/wal/colors-alacritty.toml",
    "~/.config/simplychit/local/alacritty.toml",
]
