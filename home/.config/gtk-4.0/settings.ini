[Settings]
gtk-theme-name=archdots
gtk-icon-theme-name=breeze-dark
gtk-font-name=Adwaita Sans 11
gtk-cursor-theme-name=default
gtk-cursor-theme-size=24

# No gtk-application-prefer-dark-theme here, deliberately. libadwaita rejects
# it — every GTK 4 app logs "Using GtkSettings:gtk-application-prefer-dark-theme
# with libadwaita is unsupported" on startup — and it is redundant anyway:
# install.sh sets org.gnome.desktop.interface color-scheme to prefer-dark, which
# is what libadwaita actually reads. The GTK 3 file keeps its copy, since GTK 3
# has no equivalent.
#
# nwg-look rewrites this file wholesale when you press Apply, dropping comments
# and re-adding the key. If the warning comes back, that is why.
