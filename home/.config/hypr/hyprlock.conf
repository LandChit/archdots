# Colours from the wallpaper: these defaults, then the palette, which
# `simplychit sync-palette` writes after every wallpaper change. If that file is
# missing, hyprlock logs a config error and carries on with the defaults.
$sc_background = rgb(080c14)
$sc_foreground = rgb(c1c2c4)
$sc_accent = rgb(483930)
$sc_accent_bright = rgb(ac6c4a)
$sc_surface = rgba(16161ae0)
source = ~/.local/state/simplychit/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 1
}

background {
    monitor =
    # The pointer the shell's wallpaper picker sets: a symlink kept outside the repo, so
    # the lock screen follows the wallpaper picker without this file ever having
    # to change. If it is missing, hyprlock falls back to the colour below.
    path = ~/.local/state/simplychit/wallpaper
    color = $sc_background
    blur_passes = 3 # 0 disables blurring
    blur_size = 3
}

input-field {
    monitor =
    size = 150, 40
    outline_thickness = 1
    dots_size = 0.15
    dots_spacing = 0.15
    outer_color = $sc_accent
    inner_color = $sc_surface
    font_color = $sc_foreground
    check_color = $sc_accent_bright
    font_family = sans-serif
    placeholder_text = Input Password...
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $sc_foreground
    font_size = 75
    font_family = sans-serif
    position = 0, 150
    halign = center
    valign = center
}