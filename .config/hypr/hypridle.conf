# Idle: dim → lock → screen off → suspend. Started by config/autorun.lua.
#
# With hypridle running, `loginctl lock-session` finally has a listener, so
# it locks (lock_cmd below). Dispatches use the Lua form, `hl.dsp.dpms({…})`:
# the old `dpms off` syntax is a Lua syntax error under the Lua config.
#
# Separate AC/battery timeouts and an inhibit toggle come with the shell's
# idle service (TODO.md, phase 4).

general {
    lock_cmd = pidof hyprlock || hyprlock       # never two hyprlocks
    before_sleep_cmd = loginctl lock-session    # locked before the lid opens again
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 2.5 min: dim. Does nothing on a desktop with no backlight.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screens off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
