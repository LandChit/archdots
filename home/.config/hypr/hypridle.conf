# Idle: dim → lock → screens off → suspend. Started by config/autorun.lua.
#
#                 on AC      on battery
#   dim           2.5 min    1 min
#   lock          5 min      2 min
#   screens off   5.5 min    2.5 min
#   suspend       30 min     10 min
#
# hypridle has one set of timeouts, so every step is two listeners, gated by
# condition_cmd (Scripts/power-source.sh: exit 0 on that power source). A
# listener whose condition fails skips its on-resume too. The battery ones that
# are safe to repeat retry every 30 s, so unplugging mid-idle catches up. Dim
# never retries: a second `brightnessctl -s` would save the dimmed level and
# "restore" to it.
#
# With hypridle running, `loginctl lock-session` has a listener, so it locks
# (lock_cmd). Dispatches use the Lua form, `hl.dsp.dpms({…})`: the old
# `dpms off` syntax is a Lua syntax error under the Lua config.
#
# Scripts/idle-inhibit.sh (SUPER+SHIFT+I) holds a systemd idle inhibitor,
# which pauses all of this.

# AC is the fallback: written as "not on battery", so if the script is missing
# (exit 127) the AC listeners still fire and the machine still locks.
$ac = ! $HOME/.config/hypr/Scripts/power-source.sh battery
$battery = $HOME/.config/hypr/Scripts/power-source.sh battery
$screens_off = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
$screens_on = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

general {
    lock_cmd = $HOME/.config/hypr/Scripts/lock.sh   # the shell's lock if enabled, else hyprlock
    before_sleep_cmd = loginctl lock-session    # locked before the lid opens again
    after_sleep_cmd = $screens_on
}

# ── dim (does nothing on a desktop with no backlight) ──────────────────────
listener {
    timeout = 150
    condition_cmd = $ac
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}
listener {
    timeout = 60
    condition_cmd = $battery
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# ── lock ────────────────────────────────────────────────────────────────────
listener {
    timeout = 300
    condition_cmd = $ac
    on-timeout = loginctl lock-session
}
listener {
    timeout = 120
    condition_cmd = $battery
    condition_retry = 30
    on-timeout = loginctl lock-session
}

# ── screens off ─────────────────────────────────────────────────────────────
listener {
    timeout = 330
    condition_cmd = $ac
    on-timeout = $screens_off
    on-resume = $screens_on
}
listener {
    timeout = 150
    condition_cmd = $battery
    condition_retry = 30
    on-timeout = $screens_off
    on-resume = $screens_on
}

# ── suspend ─────────────────────────────────────────────────────────────────
listener {
    timeout = 1800
    condition_cmd = $ac
    on-timeout = systemctl suspend
}
listener {
    timeout = 600
    condition_cmd = $battery
    condition_retry = 30
    on-timeout = systemctl suspend
}
